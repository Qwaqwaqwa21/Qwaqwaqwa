    color: red
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: GZ2
    color: black
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: GZ3
    color: green
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: GZ4
    color: blue
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: GZ5
    color: purple
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: GZK
    color: gold
    linestyle: '-'
    linewidth: 1.0
  grid: log
