# Конфигурация треков каротажного планшета.
# Это редактируемая копия настроек по умолчанию (plotting.DEFAULT_TRACKS_CONFIG).
# Чтобы использовать другой файл, задайте переменную окружения TRACKS_CONFIG_PATH.
#
# Схема каждого трека:
#   name:   заголовок трека
#   width:  относительная ширина (см)
#   curves: список кривых [{mnemonic, color, linestyle, linewidth, limits?}, ...]
#           limits у отдельной кривой (необязательно) — явная фиксированная
#           граница шкалы для этой кривой, приоритетнее автоподбора.
#   grid:   'linear' | 'log' | 'none'
#   limits: 'auto_per_curve' | 'auto' | 'shared' | 'auto_kp' | 'auto_k' | 'none' | [min, max]
#   ylabel: подпись оси снизу трека
#
# Чтобы добавить новую кривую/трек — допишите новый числовой ключ ниже
# по этому же образцу, перезапускать приложение не нужно.

0:
  name: Глубина
  width: 2.0
  curves: []
  grid: none
  limits: none
  ylabel: Глубина, м
1:
  name: Стандартный каротаж
  width: 5.0
  curves:
  - mnemonic: RS
    color: blue
    linestyle: --
    linewidth: 1.2
  - mnemonic: KS
    color: black
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: PS
    color: red
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: DS
    color: green
    linestyle: '-'
    linewidth: 1.0
  grid: linear
  limits: auto_per_curve
  ylabel: Ед. изм.
2:
  name: Стандартный каротаж_500
  width: 5.0
  curves:
  - mnemonic: KS_500
    color: black
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: PS_500
    color: red
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: DS_500
    color: green
    linestyle: '-'
    linewidth: 1.0
  grid: linear
  limits: auto_per_curve
  ylabel: Ед. изм.
3:
  name: Радиоактивные методы
  width: 5.0
  curves:
  - mnemonic: GK
    color: red
    linestyle: '-'
    linewidth: 1.2
  - mnemonic: NGK
    color: black
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: NKTD
    color: black
    linestyle: '-'
    linewidth: 1.0
  - mnemonic: NKTS
    color: black
    linestyle: ':'
    linewidth: 0.7
  grid: linear
  limits: auto_per_curve
  ylabel: Ед. изм.
4:
  name: Радиоактивные методы_500
  width: 5.0
  curves:
  - mnemonic: GK_500
    color: red
    linestyle: '-'
    linewidth: 1.2
  - mnemonic: NGK_500
    color: black
    linestyle: '-'
    linewidth: 1.0
  grid: linear
  limits: auto_per_curve
  ylabel: Ед. изм.
5:
  name: Сопротивление
  width: 5.0
  curves:
  - mnemonic: RP
    color: black
    linestyle: '-'
    linewidth: 1.2
  - mnemonic: IK
    color: green
    linestyle: '-'
    linewidth: 1.0
    limits: &id001
    - 0.1
    - 100
  - mnemonic: BK
    color: blue
    linestyle: '-'
    linewidth: 1.0
    limits: *id001
  - mnemonic: MBK
    color: red
    linestyle: '-'
    linewidth: 1.0
  grid: log
  limits: &id002
  - 0.1
  - 1000
  ylabel: Ом·м
6:
  name: БКЗ
  width: 5.0
  curves:
